<title>PM 작업실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 레이아웃: 벤토 그리드. 큰 소개 타일 + 진행 링 / 프로젝트 타일 3개 / 역량 타일 + 잠긴 비공개 회고 타일. */
:root{
  --bg:#F2F2F0; --tile:#FFFFFF; --ink:#101012; --muted:#6A6B73; --line:#E3E3E0;
  --hot:#FF5B24; --hot-ink:#FFFFFF; --dark:#141417; --dark-ink:#F3F3F5; --dark-muted:#9A9BA6;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"Space Grotesk","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0C; --tile:#16161A; --ink:#F3F3F5; --muted:#9A9BA6; --line:#26262C;
  --dark:#1E1E24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0C; --tile:#16161A; --ink:#F3F3F5; --muted:#9A9BA6; --line:#26262C;
  --dark:#1E1E24; color-scheme:dark}
*{box-sizing:border-box}
body{word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:22px}
.brand{font-weight:900;font-size:19px;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--hot);display:inline-block;transform:rotate(12deg)}
.hnav{display:flex;gap:6px}
.hnav a,.hnav button{font:inherit;font-size:14px;font-weight:500;padding:8px 16px;border-radius:999px;text-decoration:none;border:0;background:transparent;color:var(--muted);cursor:pointer}
.hnav a:hover{color:var(--ink);background:var(--tile)}
.hnav .lock{display:inline-flex;align-items:center;gap:6px;background:var(--tile);color:var(--ink)}

.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding-bottom:56px}
.tile{background:var(--tile);border-radius:28px;padding:32px;min-width:0;position:relative;overflow:hidden;transition:transform .2s}
a.tile{text-decoration:none;display:flex;flex-direction:column}
a.tile:hover{transform:translateY(-4px)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}a.tile:hover{transform:none}}
.label{font-family:var(--font-num);font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--muted)}

/* 소개 */
.intro{grid-column:span 12;display:flex;flex-direction:column;justify-content:space-between;gap:48px;min-height:280px;padding:44px}
.status{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 14px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:500}
.status b{width:8px;height:8px;border-radius:50%;background:var(--hot);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status b{animation:none}}
h1{font-weight:900;font-size:clamp(34px,5.6vw,72px);line-height:1.12;letter-spacing:-.05em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--hot)}
.intro p{margin:0;color:var(--muted);font-size:17px}

/* 프로젝트 */
.sec{grid-column:span 12;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 6px 0}
.sec h2{font-size:20px;letter-spacing:-.03em;margin:0;font-weight:700}
.more{font-size:13px;font-weight:500;padding:6px 14px;border-radius:999px;background:var(--tile);text-decoration:none;white-space:nowrap}
.more:hover{background:var(--ink);color:var(--bg)}
.cards{display:contents}
.proj{grid-column:span 4;min-height:340px;justify-content:space-between;gap:32px}
.proj.hot{background:var(--hot);color:var(--hot-ink)}
.proj.hot .label,.proj.hot .tags span{color:inherit}
.proj.hot .tags span{background:rgba(255,255,255,.22)}
.metric{font-family:var(--font-num);font-weight:700;font-size:clamp(52px,6vw,76px);line-height:1;letter-spacing:-.05em}
.metric small{font-family:var(--font-body);font-size:14px;font-weight:500;letter-spacing:0;margin-left:6px;opacity:.7}
.proj h2{font-size:21px;line-height:1.4;letter-spacing:-.03em;margin:10px 0 0;font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tags span{font-size:12.5px;padding:3px 12px;border-radius:999px;background:var(--bg);color:var(--muted);font-weight:500}
.arrow{position:absolute;top:28px;right:28px;width:36px;height:36px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;opacity:.5}

/* 비공개 회고 */
.priv h2{font-size:22px;letter-spacing:-.03em;margin:8px 0 20px;font-weight:700}
.priv{grid-column:span 12;background:var(--dark);color:var(--dark-ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:28px;align-items:center}
.priv .label{color:var(--dark-muted)}
.priv p{margin:0 0 20px;color:var(--dark-muted);font-size:14.5px}
.openbtn{font:inherit;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:0;background:var(--dark-ink);color:#141417;cursor:pointer}
.openbtn:hover{opacity:.88}
.msg{margin-top:14px;font-size:13px;color:var(--hot)}
.ghost{display:grid;gap:10px;filter:blur(4px);opacity:.55;user-select:none}
.ghost div{height:44px;border-radius:12px;background:rgba(255,255,255,.1)}
.ghost div:nth-child(2){width:82%}.ghost div:nth-child(3){width:64%}
.padlock{position:absolute;right:28px;bottom:28px;width:48px;height:48px;border-radius:50%;background:var(--hot);color:#fff;display:grid;place-items:center}

footer{padding-block:0 40px;font-size:13px;color:var(--muted)}

@media (max-width:960px){
  .intro,.priv{grid-column:span 12}
  .proj{grid-column:span 6}
  .intro{min-height:0}
}
@media (max-width:640px){
  .proj{grid-column:span 12;min-height:280px}
  .tile{padding:24px;border-radius:22px}
  .intro{padding:28px 24px}
  .priv{grid-template-columns:1fr}
  .hnav a.opt{display:none}
}
</style>

<div class="wrap">
  <header>
    <a class="brand" href="#top"><i></i>PM 작업실</a>
    <nav class="hnav" aria-label="주 메뉴">
      <a class="opt" href="#projects">프로젝트</a>
      <a class="lock" href="/notes">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        내 노트
      </a>
    </nav>
  </header>

  <main id="top" class="bento">
    <section class="tile intro" aria-label="소개">
      <div>
        <h1>AI PM을 배우며 만든 <em>프로젝트</em></h1>
      </div>
      <p>AI PM을 공부하며 만든 프로젝트의 과정과 결과를 계속 기록합니다.</p>
    </section>

    <div class="sec" id="projects">
      <h2>최근 프로젝트</h2>
      <a class="more" id="more" href="#board" hidden>더보기 <span aria-hidden="true">→</span></a>
    </div>
    <div class="cards" id="cards"></div>

    <section class="tile priv" id="private" aria-label="비공개 회고">
      <div>
        <span class="label">PRIVATE NOTES</span>
        <h2>회고 노트</h2>
        <p>주간 회고는 나만 읽을 수 있게 잠겨 있습니다. 방문자에게는 글 제목도 보이지 않습니다.</p>
        <button class="openbtn" type="button" id="open">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          내 노트 열기
        </button>
      </div>
      <div class="ghost" aria-hidden="true"><div></div><div></div><div></div></div>
    </section>
  </main>

  <footer>화면의 제목과 수치는 모두 예시입니다. 실제 내용으로 바꿔 쓰세요.</footer>
</div>

<script>
document.getElementById('open').addEventListener('click',function(){location.href='/notes'});

/* 프로젝트는 최신순 배열. 3개까지만 보여주고, 더 있으면 더보기 링크를 켠다. */
var PROJECTS=[
  {date:'2026.11 · 작성 중',metric:'3',unit:'가지 시안 비교',title:'AI 기능 온보딩 흐름 개선안',tags:['UX','가설 검증']},
  {date:'2026.10',metric:'50',unit:'건 채점표',title:'고객 문의 챗봇의 평가 기준 설계',tags:['평가','프롬프트']},
  {date:'2026.10',metric:'−75%',unit:'정리 시간',title:'회의록 요약 서비스, 무엇부터 만들까',tags:['사용자 인터뷰','기획']},
  {date:'2026.09',metric:'12',unit:'개 질문 정리',title:'사용자 인터뷰 질문지 개선',tags:['리서치']}
];
var MAX=3;
var cards=document.getElementById('cards');
PROJECTS.slice(0,MAX).forEach(function(p,i){
  var a=document.createElement('a');
  a.className='tile proj'+(i===0?' hot':'');
  a.href='#projects';
  var arrow=document.createElement('span');arrow.className='arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='↗';
  var label=document.createElement('span');label.className='label';label.textContent=p.date;
  var box=document.createElement('div');
  var m=document.createElement('div');m.className='metric';m.textContent=p.metric;
  var u=document.createElement('small');u.textContent=p.unit;m.appendChild(u);
  var h=document.createElement('h2');h.textContent=p.title;
  var t=document.createElement('div');t.className='tags';
  p.tags.forEach(function(x){var s=document.createElement('span');s.textContent=x;t.appendChild(s)});
  box.appendChild(m);box.appendChild(h);box.appendChild(t);
  a.appendChild(arrow);a.appendChild(label);a.appendChild(box);
  cards.appendChild(a);
});
document.getElementById('more').hidden=PROJECTS.length<=MAX;
</script>
